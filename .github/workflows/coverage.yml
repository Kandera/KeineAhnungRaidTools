name: Coverage

# Its own workflow, not a step in Check, and this is the whole point of the split.
#
# Coverage answers a different question from "do the tests pass": which branches the suite never
# reaches at all, which is where a fix lands quietly wrong. It has never had a veto -- it ran with
# continue-on-error and could not fail the build.
#
# But it ran INSIDE Check, so a push showed one run that stayed amber for as long as coverage took,
# and there was no way to see from the outside that the part which decides "may this ship" had
# finished in about eighty seconds. On 2026-08-10 that mattered: coverage had grown to 107 minutes
# (luacov turns LuaJIT's compiler off, and the loot-history tests advance simulated time across the
# four-hour trade window through second-by-second tickers), while the gate ahead of it -- the
# moved-symbol check, luacheck and the offline suite -- still took 80 seconds all together.
#
# The maintainer ships fixes DURING a raid night. A gate that answers in eighty seconds and a
# coverage report that answers in two hours are both fine; one run that looks like it takes two
# hours is not.
#
# ON DEMAND ONLY, and deliberately not on a schedule.
#
# What coverage is actually FOR here is tests/mutrun.py: the mutation sweep has to know which lines
# the suite reaches at all, or it spends its time mutating code no test executes. That makes coverage
# a precondition of a deliberate piece of work, not a background metric -- and the run that matters
# is the LOCAL one, immediately before the sweep, on the tree being swept.
#
# A number produced at 03:00 on a runner and read by nobody answers no question anyone asked, and it
# burns close to two hours doing it. So: available when someone wants it, silent otherwise.

on:
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit lua5.1 luarocks
          sudo luarocks install luacov

      # Still informational: a coverage number is a prompt to look, never a reason to stop a release.
      - name: Coverage
        continue-on-error: true
        run: |
          KART_COVERAGE=1 luajit tests/run.lua
          sed -n '/^Summary$/,$p' luacov.report.out
