name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: |
          mkdir -p dist/KeineAhnungRaidTools
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            . dist/KeineAhnungRaidTools/
          cd dist
          zip -r "../KeineAhnungRaidTools-${{ steps.version.outputs.VERSION }}.zip" KeineAhnungRaidTools/

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Pull the block between the current version header and the next one
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          # Pre-release tags have no changelog header yet; fall back to Unreleased
          if [ -z "$NOTES" ]; then
            NOTES=$(awk "/^## \[Unreleased\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          fi
          # GitHub requires the body in an env var to preserve newlines
          {
            echo "NOTES<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          body: ${{ env.NOTES }}
          files: "KeineAhnungRaidTools-${{ steps.version.outputs.VERSION }}.zip"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  discord:
    # Pre-release tags (v1.19.0-beta1 etc.) only build the GitHub release zip
    # for PTR testing; Discord announcement and CurseForge upload run on final
    # tags only.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Post German changelog to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # Pull the block between the current version header and the next one,
          # then downgrade "### Foo" headers to bold (embeds don't render # headers)
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG-de.md \
            | sed 's/^### \(.*\)/**\1**/')

          if [ -z "$NOTES" ]; then
            echo "No changelog section found for $VERSION in CHANGELOG-de.md" >&2
            exit 1
          fi

          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"

          post() {
            jq -n --arg title "$1" --arg desc "$2" --arg url "$RELEASE_URL" \
              '{embeds: [{title: $title, url: (if $title == "" then null else $url end), description: $desc, color: 15844367}]}' \
              | curl -sf -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"
          }

          # Discord embed descriptions cap at 4096 chars; split on line boundaries,
          # only the first chunk carries the title + release link
          TITLE="KeineAhnungRaidTools v${VERSION}"
          CHUNK=""
          while IFS= read -r line; do
            if [ $(( ${#CHUNK} + ${#line} + 1 )) -gt 4000 ]; then
              post "$TITLE" "$CHUNK"
              TITLE=""
              CHUNK=""
            fi
            CHUNK+="$line"$'\n'
          done <<< "$NOTES"
          if [ -n "$CHUNK" ]; then post "$TITLE" "$CHUNK"; fi

  curseforge:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package and upload to CurseForge
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
